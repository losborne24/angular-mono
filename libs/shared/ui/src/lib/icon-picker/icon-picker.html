<div class="icon-picker relative inline-flex">
  <button
    type="button"
    class="icon-trigger"
    aria-label="Change icon"
    (click)="toggle()"
  >
    <fa-icon [icon]="icon()"></fa-icon>
  </button>
  @if (open()) {
  <button
    type="button"
    class="icon-backdrop"
    aria-label="Close icon picker"
    (click)="close()"
  ></button>
  <div class="icon-grid bg-base-100" role="listbox">
    @for (option of icons; track $index) {
    <button
      type="button"
      class="icon-option"
      [class.icon-option--active]="option === icon()"
      (click)="select(option)"
    >
      <fa-icon [icon]="option"></fa-icon>
    </button>
    }
  </div>
  }
</div>
